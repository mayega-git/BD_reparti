# ─── Configuration du cluster Elasticsearch distribué ───

cluster:
  nom: "vpdf-cluster"       # Nom du cluster (partagé par tous les nœuds)
  nombre_noeuds: 7           # Nombre total de nœuds (minimum 7)

# IP de la machine maître.
# → Laisser VIDE ("") si cette machine EST le maître.
# → Renseigner l'IP si cette machine est un auxiliaire.
ip_maitre: ""

# IP locale de CETTE machine (celle annoncée aux autres nœuds du cluster).
# → Renseigner l'IP du LAN à utiliser (ex : "192.168.123.155").
# → Laisser VIDE ("") pour laisser le programme la détecter automatiquement.
ip_locale: ""
