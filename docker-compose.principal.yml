version: '3.8'

services:

  es-node1:
    image: elasticsearch:8.13.0
    container_name: vpdf-node1
    environment:
      - node.name=node-1
      - cluster.name=vpdf-cluster
      - network.host=0.0.0.0
      - network.publish_host=192.168.123.155
      - discovery.seed_hosts=192.168.123.155:9302,192.168.123.155:9303,192.168.123.156:9304,192.168.123.156:9305
      - cluster.initial_master_nodes=node-1,node-2,node-3,node-4,node-5
      - transport.publish_port=9301
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200"
      - "9301:9300"
    volumes:
      - es-data1:/usr/share/elasticsearch/data
    networks:
      - vpdf-net

  es-node2:
    image: elasticsearch:8.13.0
    container_name: vpdf-node2
    environment:
      - node.name=node-2
      - cluster.name=vpdf-cluster
      - network.host=0.0.0.0
      - network.publish_host=192.168.123.155
      - discovery.seed_hosts=192.168.123.155:9301,192.168.123.155:9303,192.168.123.156:9304,192.168.123.156:9305
      - cluster.initial_master_nodes=node-1,node-2,node-3,node-4,node-5
      - transport.publish_port=9302
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9202:9200"
      - "9302:9300"
    volumes:
      - es-data2:/usr/share/elasticsearch/data
    networks:
      - vpdf-net

  es-node3:
    image: elasticsearch:8.13.0
    container_name: vpdf-node3
    environment:
      - node.name=node-3
      - cluster.name=vpdf-cluster
      - network.host=0.0.0.0
      - network.publish_host=192.168.123.155
      - discovery.seed_hosts=192.168.123.155:9301,192.168.123.155:9302,192.168.123.156:9304,192.168.123.156:9305
      - cluster.initial_master_nodes=node-1,node-2,node-3,node-4,node-5
      - transport.publish_port=9303
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9203:9200"
      - "9303:9300"
    volumes:
      - es-data3:/usr/share/elasticsearch/data
    networks:
      - vpdf-net

  es-node4:
    image: elasticsearch:8.13.0
    container_name: vpdf-node4
    environment:
      - node.name=node-4
      - cluster.name=vpdf-cluster
      - network.host=0.0.0.0
      - network.publish_host=192.168.123.155
      - discovery.seed_hosts=192.168.123.155:9301,192.168.123.155:9302,192.168.123.155:9303,192.168.123.156:9305
      - cluster.initial_master_nodes=node-1,node-2,node-3,node-4,node-5
      - transport.publish_port=9304
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9204:9200"
      - "9304:9300"
    volumes:
      - es-data4:/usr/share/elasticsearch/data
    networks:
      - vpdf-net

  kibana:
    image: kibana:8.13.0
    container_name: vpdf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://vpdf-node1:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    networks:
      - vpdf-net
    depends_on:
      - es-node1

volumes:
  es-data1:
    name: vpdf-es-data1
  es-data2:
    name: vpdf-es-data2
  es-data3:
    name: vpdf-es-data3
  es-data4:
    name: vpdf-es-data4


networks:
  vpdf-net:
    name: vpdf-network
    driver: bridge
